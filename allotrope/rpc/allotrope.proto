// The actuation interface: the boundary between a controller and the plant.
//
// This is the hard interface the project's C-HIL claim depends on. Whatever
// sits behind it -- the simulated PolarMicrogrid today, a Typhoon HIL rig
// tomorrow -- receives the same DispatchCommand and returns the same Telemetry,
// so swapping the plant for the rig is a deployment change, not a rewrite.
//
// The deck budgets control latency at under 10 ms. That budget is enforced at
// the call site (allotrope.safety.fallback.GuardedController), not by this
// schema; this file only defines what crosses the wire.

syntax = "proto3";

package allotrope;

service Actuation {
  // One dispatch cycle: send a command, receive the telemetry it produced.
  rpc Dispatch(DispatchRequest) returns (DispatchResponse);

  // The plant's condition before a command is chosen, for a controller that
  // wants a fresh reading rather than trusting the last response.
  rpc Observe(ObserveRequest) returns (Observation);
}

message DispatchRequest {
  repeated bool genset_on = 1;
  repeated float genset_setpoint_kw = 2;
  repeated float battery_kw = 3;
  float snow_melt_kw = 4;
}

message DispatchResponse {
  Telemetry telemetry = 1;
  SafetyReport safety = 2;
}

message Telemetry {
  double genset_kw = 1;
  repeated double genset_power_kw = 2;
  repeated bool genset_online = 3;
  double fuel_l = 4;
  double black_carbon_mg = 5;
  double renewable_used_kw = 6;
  double curtailed_kw = 7;
  repeated double battery_kw = 8;
  repeated double battery_soc = 9;
  double electrical_load_kw = 10;
  double melt_kw = 11;
  double unserved_kw = 12;
  double critical_unserved_kw = 13;
  double indoor_temp_c = 14;
  double air_temp_c = 15;
}

message SafetyReport {
  bool intervened = 1;
  repeated string interventions = 2;
  double required_capacity_kw = 3;
  double committed_capacity_kw = 4;
}

message ObserveRequest {}

message Observation {
  double electrical_load_kw = 1;
  double critical_load_kw = 2;
  double firm_thermal_kw = 3;
  double pv_available_kw = 4;
  double wind_available_kw = 5;
  double air_temp_c = 6;
  double wind_speed_ms = 7;
  double indoor_temp_c = 8;
  repeated bool genset_online = 9;
  repeated double genset_power_kw = 10;
  repeated double genset_deposit = 11;
  repeated double battery_soc = 12;
}
