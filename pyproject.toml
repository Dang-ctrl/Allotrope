[project]
name = "allotrope"
version = "0.1.0"
description = "AI-driven safe energy management for polar research station microgrids (SIH 2026, PS SIH26061)"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "scipy>=1.11",
    "pyyaml>=6.0",
    "gymnasium>=1.0",
    "pypsa>=1.0",
    "opendssdirect.py>=0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["allotrope*"]

[tool.setuptools.package-data]
allotrope = ["config/stations/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
