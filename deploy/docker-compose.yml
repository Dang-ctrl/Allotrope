# The full stack: MQTT for telemetry, TimescaleDB for storage, Grafana for
# the HMI, and one container per station running its plant + guarded
# controller loop in-process (see docs/control-plane.md for why there is no
# remote command-injection path here -- the gRPC control plane distributes
# state, it does not drive actuation).
#
# Not exercised end to end in the development sandbox this project was built
# in -- that environment has the Docker CLI but no running daemon. Every piece
# that does not require an actual container runtime (MQTT pub/sub, the
# TimescaleDB bridge's SQL, the gRPC control plane) is unit- and
# integration-tested under tests/; this compose file is the infrastructure
# that wires the same, already-tested Python together for a real deployment.
#
# Requires MQTT_USERNAME and MQTT_PASSWORD (e.g. in a `.env` file next to
# this compose file) -- found in this project's own adversarial audit (F7):
# the broker previously allowed fully anonymous publish, including to the
# topic model weights travel on for federated learning. There is
# deliberately no default here, per this project's own rule against
# hardcoded secrets; `docker compose up` fails fast with a clear message if
# either is unset, rather than silently falling back to anonymous access.
#
# Run with: docker compose -f deploy/docker-compose.yml up --build

services:
  mosquitto:
    image: eclipse-mosquitto:2
    restart: unless-stopped
    ports: ["1883:1883"]
    environment:
      MQTT_USERNAME: ${MQTT_USERNAME:?set MQTT_USERNAME (and MQTT_PASSWORD) -- see this file's header comment}
      MQTT_PASSWORD: ${MQTT_PASSWORD:?set MQTT_PASSWORD (and MQTT_USERNAME) -- see this file's header comment}
    volumes:
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    # The image ships no way to set credentials via environment variables
    # directly, so this generates the password file mosquitto.conf points at
    # before starting the broker -- the same one-time-setup step
    # `mosquitto_passwd` normally does by hand.
    entrypoint: ["sh", "-c"]
    command:
      - |
        mosquitto_passwd -b -c /mosquitto/config/passwd "$$MQTT_USERNAME" "$$MQTT_PASSWORD"
        exec mosquitto -c /mosquitto/config/mosquitto.conf
    healthcheck:
      test: >
        mosquitto_sub -h localhost -p 1883 -u "$$MQTT_USERNAME" -P "$$MQTT_PASSWORD"
        -t '$$SYS/broker/uptime' -C 1 -W 3 || exit 1
      interval: 10s
      timeout: 5s
      retries: 5

  timescaledb:
    image: timescale/timescaledb:latest-pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: allotrope
      POSTGRES_PASSWORD: allotrope
      POSTGRES_DB: allotrope
    ports: ["5432:5432"]
    volumes:
      - ./init-timescaledb.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - timescale_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U allotrope -d allotrope"]
      interval: 10s
      timeout: 5s
      retries: 5

  grafana:
    image: grafana/grafana:11.2.0
    restart: unless-stopped
    ports: ["3000:3000"]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: allotrope
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      timescaledb:
        condition: service_healthy

  bridge:
    build: { context: .., dockerfile: deploy/Dockerfile }
    restart: unless-stopped
    environment:
      MQTT_USERNAME: ${MQTT_USERNAME:?set MQTT_USERNAME (and MQTT_PASSWORD)}
      MQTT_PASSWORD: ${MQTT_PASSWORD:?set MQTT_PASSWORD (and MQTT_USERNAME)}
    command: >
      scripts/run_timescale_bridge.py
      --stations maitri bharati
      --mqtt-host mosquitto
      --db-dsn postgresql://allotrope:allotrope@timescaledb:5432/allotrope
    depends_on:
      mosquitto: { condition: service_healthy }
      timescaledb: { condition: service_healthy }

  station-maitri:
    build: { context: .., dockerfile: deploy/Dockerfile }
    restart: unless-stopped
    environment:
      MQTT_USERNAME: ${MQTT_USERNAME:?set MQTT_USERNAME (and MQTT_PASSWORD)}
      MQTT_PASSWORD: ${MQTT_PASSWORD:?set MQTT_PASSWORD (and MQTT_USERNAME)}
    command: >
      scripts/run_station_service.py
      --station maitri
      --mqtt-host mosquitto
      --interval-s 2.0
    depends_on:
      mosquitto: { condition: service_healthy }

  station-bharati:
    build: { context: .., dockerfile: deploy/Dockerfile }
    restart: unless-stopped
    environment:
      MQTT_USERNAME: ${MQTT_USERNAME:?set MQTT_USERNAME (and MQTT_PASSWORD)}
      MQTT_PASSWORD: ${MQTT_PASSWORD:?set MQTT_PASSWORD (and MQTT_USERNAME)}
    command: >
      scripts/run_station_service.py
      --station bharati
      --mqtt-host mosquitto
      --interval-s 2.0
    depends_on:
      mosquitto: { condition: service_healthy }

  api:
    build: { context: .., dockerfile: deploy/Dockerfile }
    command: >
      scripts/run_api.py
      --host 0.0.0.0 --port 8000
      --mqtt-host mosquitto
      --db-dsn postgresql://allotrope:allotrope@timescaledb:5432/allotrope
      --grpc-targets maitri=station-maitri:50051 bharati=station-bharati:50051
    ports: ["8000:8000"]
    depends_on: [mosquitto, timescaledb, station-maitri, station-bharati]

volumes:
  timescale_data:
